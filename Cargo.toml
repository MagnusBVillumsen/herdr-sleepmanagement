[package]
name = "herdr-sleep"
version = "0.1.0"
edition = "2024"
description = "Wake machines, and put them to sleep once their Herdr agents are done"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MagnusBVillumsen/herdr-sleepmanagement"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
